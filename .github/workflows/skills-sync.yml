name: Sync skills from fork

# Reusable workflow. Consumer repos call it from their own scheduled workflow:
#
#   jobs:
#     sync:
#       uses: timschoch/mattpocock-skills/.github/workflows/skills-sync.yml@main
#       permissions:
#         contents: write
#         pull-requests: write
#       secrets:
#         LEMY_SKILLS_SYNC_TOKEN: ${{ secrets.LEMY_SKILLS_SYNC_TOKEN }}
#         SKILLS_SYNC_PR_TOKEN: ${{ secrets.SKILLS_SYNC_PR_TOKEN }}
#
# It runs `npx skills update` against the CALLER's repo (skills-lock.json),
# then opens a PR when, and only when, something changed. No diff -> no PR.
# With auto-merge on (default), the PR is squash-merged as soon as it exists.
#
# Two tokens, two different jobs. Both optional. `secrets: inherit` does NOT
# deliver either to this cross-repo reusable workflow, so pass them EXPLICITLY
# as above (verified: env fell back to github.token).
#
# LEMY_SKILLS_SYNC_TOKEN READS the skill sources. The runner's github.token
# reads only the caller repo, so a source pinned from a PRIVATE repo needs a
# fine-grained PAT with Contents: read on that source. This one token reads
# every pinned source, and a fine-grained PAT reads public ones by default.
# Omit it where every source is public.
#
# SKILLS_SYNC_PR_TOKEN OPENS the PR. Without it the PR is GITHUB_TOKEN's, and
# GitHub parks that PR's own workflow runs as `action_required` instead of
# running them. Where a required status check gates the base branch, the check
# never reports and auto-merge waits forever. A fine-grained PAT with Contents:
# write and Pull requests: write on the CONSUMER repo makes the PR a user's, so
# its checks run and auto-merge fires. Omit it only where no required check
# gates the base branch, and there enable Settings -> Actions -> General ->
# "Allow GitHub Actions to create and approve pull requests" instead.

on:
  workflow_call:
    secrets:
      LEMY_SKILLS_SYNC_TOKEN:
        description: >-
          Token the skills CLI reads private skill sources with (fine-grained
          PAT, Contents: read on each private source). Optional, public sources
          work with the default github.token.
        required: false
      SKILLS_SYNC_PR_TOKEN:
        description: >-
          Token that opens the sync PR (fine-grained PAT, Contents: write and
          Pull requests: write on the consumer repo). Optional, but without it
          the PR is GITHUB_TOKEN's and its checks are parked action_required.
        required: false
    inputs:
      branch:
        description: Branch the sync PR is opened from
        type: string
        default: chore/sync-skills
      node-version:
        description: Node version used to run the skills CLI
        type: string
        default: "24"
      auto-merge:
        description: Squash-merge the sync PR automatically once opened
        type: boolean
        default: true

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ inputs.node-version }}

      - name: Mark Claude Code as an installed agent
        # `skills update` writes to the shared `.agents/skills` store only when it
        # detects an installed agent, which it does by probing `$HOME/.claude` etc.
        # A bare CI runner has none, so it falls back to Eve's `agent/skills` dir
        # and opens a bogus duplicate-tree PR. Seeding `$HOME/.claude` makes it
        # resolve the same universal store this repo actually uses.
        run: mkdir -p "$HOME/.claude"

      - name: Update pinned skills
        env:
          GITHUB_TOKEN: ${{ secrets.LEMY_SKILLS_SYNC_TOKEN || github.token }}
        run: npx skills@latest update -p -y

      - name: Open PR if anything changed
        id: cpr
        uses: peter-evans/create-pull-request@v8
        with:
          token: ${{ secrets.SKILLS_SYNC_PR_TOKEN || github.token }}
          branch: ${{ inputs.branch }}
          delete-branch: true
          commit-message: "chore(skills): sync skills from fork"
          title: "chore(skills): sync skills from fork"
          body: |
            Automated `npx skills update`. Pulls the latest pinned skills from the fork.

            Only `.agents/skills/**` and `skills-lock.json` change. This PR is opened
            only when the update produced a diff; if the branch already exists it is
            updated in place rather than opening a second PR.

      - name: Auto-merge the sync PR
        if: >-
          inputs.auto-merge &&
          (steps.cpr.outputs.pull-request-operation == 'created' ||
           steps.cpr.outputs.pull-request-operation == 'updated')
        env:
          GH_TOKEN: ${{ secrets.SKILLS_SYNC_PR_TOKEN || github.token }}
          PR: ${{ steps.cpr.outputs.pull-request-number }}
        # Prefer native auto-merge (waits for required checks on protected repos).
        # Fall back to an admin squash-merge where auto-merge isn't available
        # (e.g. Free-plan private repos): --admin calls the REST merge directly so
        # a still-pending NON-required check (e.g. a Vercel preview) doesn't block it.
        run: gh pr merge "$PR" --squash --delete-branch --auto || gh pr merge "$PR" --squash --delete-branch --admin
